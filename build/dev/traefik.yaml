apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: traefik
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: https://helm.traefik.io/traefik
    chart: traefik
    targetRevision: v40.2.0
    helm:
      valueFiles:
      - $values/envs/dev/traefik-values.yaml
  - repoURL: https://github.com/johan253/gitops.git
    targetRevision: master
    ref: values

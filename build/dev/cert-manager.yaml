apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  sources:
  - repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: 1.20.2
    helm:
      valueFiles:
      - $values/envs/dev/cert-manager-values.yaml
  - repoURL: https://github.com/johan253/gitops.git
    targetRevision: master
    ref: values

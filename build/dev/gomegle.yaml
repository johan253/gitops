apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: gomegle
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: gomegle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: oci://ghcr.io/johan253/charts
    chart: gomegle
    targetRevision: 0.2.0-22f0009
    helm:
      valueFiles:
      - $values/envs/dev/gomegle-values.yaml
  - repoURL: https://github.com/johan253/gitops.git
    targetRevision: dev
    ref: values

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  sources:
  - repoURL: https://grafana.github.io/helm-charts
    chart: grafana-operator
    targetRevision: v5.22.0
    helm:
      valueFiles:
      - $values/envs/dev/grafana-operator-values.yaml
  - repoURL: https://github.com/johan253/gitops.git
    targetRevision: dev
    ref: values

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: root-dev
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - matrix:
        generators:
          # Left side: all app definitions
          - git:
              repoURL: https://github.com/johan253/gitops.git
              revision: master
              files:
                - path: "apps/*.yaml"

          # Right side: only values files that exist for dev
          - git:
              repoURL: https://github.com/johan253/gitops.git
              revision: master
              files:
                - path: "envs/dev/*-values.yaml"

      # This filter is the critical piece — it joins the two sides
      # by matching the app name from apps/ against the values filename
      selector:
        matchExpressions:
          - key: appName
            operator: In
            values: ["{{ .path.basenameNormalized | trimSuffix \"-values\" }}"]

  template:
    metadata:
      name: "{{ .appName }}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{ .project }}"

      sources:
        - repoURL: "{{ .repoURL }}"
          targetRevision: "{{ .targetRevision }}"
          path: "{{ .helmPath | default \"\" }}"
          chart: "{{ .helmChart | default \"\" }}"
          helm:
            valueFiles:
              - $values/envs/dev/{{ .appName }}-values.yaml

        # Always included: gitops repo as the values ref
        - repoURL: https://github.com/johan253/gitops.git
          targetRevision: master
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
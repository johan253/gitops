apps:
  cert-manager:
    repoURL: https://charts.jetstack.io
    helmChart: cert-manager
    namespace: cert-manager
    syncOptions:
      - ServerSideApply=true
  external-secrets:
    repoURL: https://charts.external-secrets.io
    helmChart: external-secrets
    namespace: external-secrets-operator
    syncOptions:
      - ServerSideApply=true
  gomegle:
    dependencies:
      - external-secrets
      - traefik
    repoURL: ghcr.io/johan253/charts
    helmChart: gomegle
    namespace: gomegle
  grafana-operator:
    dependencies:
      - external-secrets
      - traefik
    repoURL: https://grafana.github.io/helm-charts
    helmChart: grafana-operator
    namespace: monitoring
  prometheus:
    dependencies:
      - grafana-operator
    repoURL: https://prometheus-community.github.io/helm-charts
    helmChart: prometheus
    namespace: monitoring
  ratemycourses:
    dependencies:
      - external-secrets
      - traefik
    repoURL: ghcr.io/johan253/charts
    helmChart: ratemycourses
    namespace: ratemycourses
  traefik:
    dependencies:
      - cert-manager
    repoURL: https://helm.traefik.io/traefik
    helmChart: traefik
    namespace: traefik

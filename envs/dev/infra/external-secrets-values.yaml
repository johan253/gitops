appName: external-secrets
# install CRDs before extra objects
installCRDs: true
# Define cluster secret store as an extra object to ensure it's created before any ExternalSecrets
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: infisical
    spec:
      provider:
        infisical:
          hostAPI: https://app.infisical.com
          auth:
            universalAuthCredentials:
              clientId:
                name: universal-auth-credentials
                key: clientId
                namespace: external-secrets-operator
              clientSecret:
                name: universal-auth-credentials
                key: clientSecret
                namespace: external-secrets-operator
          secretsScope:
            projectSlug: prd-79-wp
            environmentSlug: dev
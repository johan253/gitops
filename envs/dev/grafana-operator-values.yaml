appName: grafana-operator

extraObjects:
  # Wave -1: ArgoCD waits for ESO to resolve this into a Secret (Ready: true)
  # before moving to later waves, so credentials exist when Grafana starts
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-operator-github-oauth
      namespace: monitoring
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      secretStoreRef:
        name: infisical
        kind: ClusterSecretStore
      target:
        name: grafana-github-oauth
      data:
        - secretKey: GF_AUTH_GITHUB_CLIENT_ID
          remoteRef:
            key: /grafana/oauth/github/clientId
        - secretKey: GF_AUTH_GITHUB_CLIENT_SECRET
          remoteRef:
            key: /grafana/oauth/github/clientSecret

  # Wave 1: PVC and Grafana CR are applied together — the CR creates the Pod,
  # which triggers WaitForFirstConsumer binding on the PVC
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: grafana-pvc
      namespace: monitoring
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi

  # Wave 1: Grafana CR — CRDs exist (Helm installs them first), secret is ready, PVC is bound
  - apiVersion: grafana.integreatly.org/v1beta1
    kind: Grafana
    metadata:
      name: grafana
      namespace: monitoring
      labels:
        dashboards: grafana # GrafanaDashboard CRs use this label to target this instance
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      config:
        security:
          admin_user: admin
        log:
          mode: console
        server:
          root_url: https://grafana.dev.johanhernandez.com
        auth:
          disable_login_form: "false"
        auth.github:
          enabled: "true"
          allow_sign_up: "true"
          client_id: $__env{GF_AUTH_GITHUB_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
          scopes: user:email,read:org
          auth_url: https://github.com/login/oauth/authorize
          token_url: https://github.com/login/oauth/access_token
          api_url: https://api.github.com/user
          allowed_organizations: johansorg
          role_attribute_path: contains(groups[*], '@johansorg/owner') && 'Admin' || 'Editor'
      deployment:
        spec:
          template:
            spec:
              containers:
                - name: grafana
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                  envFrom:
                    - secretRef:
                        name: grafana-github-oauth
                  volumeMounts:
                    - name: grafana-storage
                      mountPath: /var/lib/grafana
              volumes:
                - name: grafana-storage
                  persistentVolumeClaim:
                    claimName: grafana-pvc
  # Wave 1: Ingress and TLS cert — depends on Grafana being up to respond to ACME challenges, but can be applied in the same wave since ArgoCD doesn't wait for resources to be Ready before moving to the next wave
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: grafana-tls
      namespace: monitoring
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      secretName: grafana-tls
      dnsNames:
        - grafana.dev.johanhernandez.com
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
  # IngressRoute wave 2 — depends on TLS cert being issued, but ArgoCD doesn't wait for that, so it's in the next wave to ensure it gets applied after the cert
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: grafana-ingress
      namespace: monitoring
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      entryPoints:
        - websecure
      routes:
        - match: Host(`grafana.dev.johanhernandez.com`)
          kind: Rule
          services:
            - name: grafana
              port: 80

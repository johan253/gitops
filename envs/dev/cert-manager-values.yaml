crds:
  enabled: true

extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-http
      annotations:
        argocd.argoproj.io/sync-wave: "1" # Sync after CRDs
    spec:
      acme:
        email: johannjo2000@gmail.com
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-http
        solvers:
          - http01:
              ingress:
                class: traefik
